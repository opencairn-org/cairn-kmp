# detekt 2 configuration; builds upon the default config (buildUponDefaultConfig = true).
style:
  MagicNumber:
    active: false
  ReturnCount:
    max: 3
  MaxLineLength:
    maxLineLength: 120
  ForbiddenComment:
    active: true
    comments:
      - reason: "Track work in the issue tracker, not in comments."
        value: "FIXME:"

complexity:
  LongParameterList:
    allowedFunctionParameters: 8
    allowedConstructorParameters: 10
    ignoreDefaultParameters: true
  TooManyFunctions:
    allowedFunctionsPerClass: 20
    allowedFunctionsPerInterface: 20
    allowedFunctionsPerObject: 20
    ignorePrivate: true
  # Composable screens are declarative trees, not control flow; size/complexity limits apply to logic.
  LongMethod:
    active: true
    allowedLines: 50
    ignoreAnnotated: ["Composable"]
  CognitiveComplexMethod:
    active: true
    allowedComplexity: 15
    ignoreAnnotated: ["Composable"]
  CyclomaticComplexMethod:
    active: true
    ignoreAnnotated: ["Composable"]
    # enum/proto mappings are one `when` with a branch per value, not logic
    ignoreSimpleWhenEntries: true

naming:
  FunctionNaming:
    # Composable functions are PascalCase.
    ignoreAnnotated: ["Composable"]
  TopLevelPropertyNaming:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: true
  SwallowedException:
    active: true

empty-blocks:
  EmptyCatchBlock:
    active: true
