# On a v* tag: gate with check.yml, build the signed Android APK (GitHub flavor) and the desktop
# packages, generate SBOMs, sign everything keyless with cosign, attest provenance, and create the
# GitHub release with the tag's CHANGELOG section. The `release` environment requires approval.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  check:
    uses: ./.github/workflows/check.yml # zizmor: ignore[self-repository] fleetlint pins by this form
    permissions:
      contents: read
      security-events: write
  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    permissions:
      contents: read
      id-token: write       # cosign keyless + attestations
      attestations: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true   # release builds never read a cache another run could have poisoned
      - id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          # versionCode: monotonically increasing from the tag (major*1_000_000 + minor*1_000 + patch)
          IFS=. read -r major minor patch <<< "${tag#v}"
          patch="${patch%%-*}"
          echo "code=$(( major * 1000000 + minor * 1000 + patch ))" >> "$GITHUB_OUTPUT"
      - name: Decode the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
      - name: Reproducible build inputs
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Build the signed release APK
        env:
          CAIRN_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          CAIRN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CAIRN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CAIRN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.meta.outputs.version }}
          CODE: ${{ steps.meta.outputs.code }}
        run: |
          ./gradlew --console=plain :app:android:assembleGithubRelease :app:android:cyclonedxBom \
            -Pcairn.versionName="$VERSION" -Pcairn.versionCode="$CODE"
          mkdir -p dist
          cp app/android/build/outputs/apk/github/release/android-github-release.apk "dist/cairn-${VERSION}-android.apk"
          cp app/android/build/reports/cyclonedx/bom.json "dist/cairn-${VERSION}-android.cdx.json"
          rm -f "$RUNNER_TEMP/upload.keystore"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign artifacts (cosign keyless)
        run: |
          for f in dist/*.apk dist/*.cdx.json; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: dist/
          if-no-files-found: error
  desktop:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true   # release builds never read a cache another run could have poisoned
      - name: Build desktop packages with Conveyor (Linux, Windows, macOS from one runner)
        uses: hydraulic-software/conveyor/actions/build@7370ce828ff1cbc38b95426ffb2fd613492016d5 # v22.3
        with:
          command: make copied-site
          extra_flags: -Kapp.version=${GITHUB_REF_NAME#v}
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}
          agree_to_license: 1
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: output/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop
          path: output/
          if-no-files-found: error
  publish:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: SBOM of the source tree (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/cairn-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        run: (cd dist && sha256sum -- * > checksums.txt)
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          awk -v v="$v" '$0 ~ "^## \\["v"\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
          {
            echo
            echo "## Verify"
            echo '```sh'
            echo "cosign verify-blob --bundle cairn-${v}-android.apk.sigstore.json \\"
            echo "  --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com cairn-${v}-android.apk"
            echo "gh attestation verify cairn-${v}-android.apk --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } >> notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md $prerelease dist/*
