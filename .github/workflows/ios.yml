# Compiles the shared Kotlin framework for the iOS simulator; the only check that needs a Mac.
name: ios
on:
  pull_request:
    paths: ["**/*.kt", "**/*.kts", "gradle/**", "proto/**", "app/ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  framework:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - run: ./gradlew --console=plain :app:shared:linkDebugFrameworkIosSimulatorArm64
