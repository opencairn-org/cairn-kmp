// Conveyor packaging for the desktop app (Linux, Windows, macOS from one Linux runner).
// Docs: https://conveyor.hydraulic.dev/ ; the Compose plugin exports the JVM inputs via `conveyor.conf`
// generation of the Gradle plugin (`./gradlew :app:desktop:printConveyorConfig`).
include required("https://raw.githubusercontent.com/hydraulic-software/conveyor/master/configs/jvm/extract-native-libraries.conf")
include "#!./gradlew -q :app:desktop:printConveyorConfig"

app {
  display-name = "Cairn"
  fsname = cairn
  rdns-name = org.opencairn.cairn
  vendor = "The Cairn Authors"
  description = "Your activities, on every device"
  license = AGPL-3.0
  icons = "app/desktop/icons/icon.svg"
  vcs-url = "https://github.com/opencairn-org/cairn-kmp"
  // app.version is passed by the release workflow (-Kapp.version=X.Y.Z).
  // Only the platforms MapLibre ships a desktop render backend for (no Intel macOS build exists).
  machines = [ windows.amd64, linux.amd64.glibc, mac.aarch64 ]

  // GitHub Releases host the packages and act as the update site.
  site.base-url = "https://github.com/opencairn-org/cairn-kmp/releases/latest/download"
  // `make site` only writes the packages and update metadata to output/; the release workflow
  // uploads them itself. (With a GitHub base-url, `copied-site` would publish a release on its own.)
  site.copy-to = null
  updates = aggressive

  jvm {
    // JDK 25, bundled per platform via jlink.
    version = 25
    modules = [ java.base, java.desktop, java.logging, java.net.http, java.sql, jdk.unsupported, jdk.crypto.ec ]
  }

  // Certificates are added later; until then packages are self-signed (Windows) / unsigned (macOS).
  // maplibre-native's dylib is built against macOS 14.3; Conveyor refuses a lower minimum.
  mac.info-plist.LSMinimumSystemVersion = 14.3
  // Dependency resolution for the .deb against Ubuntu LTS indexes from the official archive
  // (Conveyor's default picks random community mirrors, which time out on CI runners).
  linux.debian.distributions = [
    { name = "noble", mirrors = ["http://archive.ubuntu.com/ubuntu/", "http://ports.ubuntu.com/ubuntu-ports/"] }
  ]
}

conveyor.compatibility-level = 22
